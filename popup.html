<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Board Tools</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <img
          class="popup__icon"
          src="icons/icon-48.png"
          alt=""
          width="32"
          height="32"
        >
        <div>
          <h1>Chess Board Tools</h1>
          <p>Keyboard controls and optional board helpers.</p>
        </div>
      </header>

      <button id="open-floating-settings" type="button">Open floating settings</button>
      <p id="floating-open-status" class="status" role="status" aria-live="polite"></p>
      <div id="settings-content"></div>
    </main>

    <script src="settings.js"></script>
    <script src="popup.js"></script>
    <script src="fog-popup.js"></script>
    <script src="assist-popup.js"></script>
    <script src="settings-view.js"></script>
    <script src="popup-entry.js"></script>
  </body>
</html>
