<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Player privacy regression checks</title>
<link rel="stylesheet" href="../player.css">
<style>body {font:16px system-ui;background:#302e2b;color:#eee;padding:24px} .player-component {display:flex;gap:24px;margin:16px} .player-tagline {min-width:160px} .pass {color:#a4e687}</style>
<h1>Player privacy regression checks</h1><ol id="results"></ol>
<div id="toolbar"></div><div id="second"></div>
<div id="board-layout-main">
<div id="board-layout-player-top"><div class="player-component">
<div class="player-avatar"><img alt="Avatar of Alice" width="40" height="40"></div>
<div class="player-tagline"><div class="cc-user-block-component"><button data-test-element="user-tagline-username">Alice</button><span>(1800)</span><span>GM</span></div><wc-captured-pieces player-color="2">+1</wc-captured-pieces></div><div class="clock-component clock-black">5:00</div>
</div></div>
<wc-chess-board id="board-single"></wc-chess-board>
<div id="board-layout-player-bottom"><div class="player-component">
<div class="player-avatar"><img alt="Avatar of Bob" width="40" height="40"></div>
<div class="player-tagline"><div class="cc-user-block-component"><button data-test-element="user-tagline-username">Bob</button><span>(1900)</span></div><wc-captured-pieces player-color="1">+2</wc-captured-pieces></div><div class="clock-component clock-white">4:58</div>
</div></div>
</div>
<aside id="chat"><div class="cc-user-block-component">Alice in chat</div></aside>
<div class="floating-modal-component"><div class="open-games-list-component open-games-list-floating" id="games"></div></div>
<div class="game-start-message-component moves-tab-rating-info-ratingInfo" id="match"><a class="user-chess-title">GM</a> <a class="user-username username" href="#bob">Bob</a> (1900) [1] vs. <a class="user-username username" href="#alice">Alice</a> (1800) [1] (15 + 10)
win +3 / draw -5 / lose -13</div>
<div class="game-start-message-component" id="chat-copy"></div>
<script>
const listeners = [], events = {};
let values = {}, failSave = false, flipped = false;
window.chrome = {storage:{local:{get:async()=>({}), remove:async()=>{}},sync:{get:async()=>values,set:async data=>{
 if(failSave) throw Error('save'); Object.assign(values,data);
 listeners.forEach(fn=>fn(Object.fromEntries(Object.entries(data).map(([k,v])=>[k,{newValue:v}])), 'sync'));
}},onChanged:{addListener:fn=>listeners.push(fn)}}};
window.ChessBoardAssist = {readCoordinates:()=>({flipped})};
</script>
<script src="../settings.js"></script><script src="../player-popup.js"></script><script src="../player-content.js"></script>
<script>
function gameItem(white, black, classes) {
 const item=document.createElement('div');
 item.className='open-games-item-component '+classes;
 const row=(name,time)=>`<div class="open-games-player-component"><div class="cc-user-block-component open-games-player-tagline"><div role="button" tabindex="0" data-test-element="user-tagline-username">${name}</div><span class="cc-user-rating-default">(1500)</span><span class="cc-country-flag-component">Flag</span></div><span class="open-games-player-result">${time}</span></div>`;
 item.innerHTML=`<div class="open-games-item-players">${row(white,'14:58')}${row(black,'14:56')}</div>`;
 document.querySelector('#games').append(item);
 return item;
}
const activeGame=gameItem('Bob','Alice','open-games-item-active open-games-item-broadcaster');
const otherGame=gameItem('Bob','Alice','open-games-item-broadcaster');
const otherPair=gameItem('Alice','Carol','open-games-item-active open-games-item-broadcaster');
const personalList=gameItem('Bob','Alice','open-games-item-active');
const match=document.querySelector('#match'), originalMatch=match.innerHTML;
document.querySelector('#chat-copy').innerHTML=originalMatch;
window.playerFixtureDone = (async()=>{
 const wait = () => new Promise(r=>setTimeout(r,60));
 const check = (name,ok)=>{const li=document.createElement('li');li.textContent=(ok?'PASS: ':'FAIL: ')+name;li.className=ok?'pass':'fail';document.querySelector('#results').append(li);if(!ok)throw Error(name)};
 const visible = e=>getComputedStyle(e).display !== 'none';
 const panel = document.querySelector('#board-layout-player-top');
 const block = panel.querySelector('.cc-user-block-component');
 const avatar = panel.querySelector('.player-avatar');
 const controls = '<input id="hide-player-info" type="checkbox" disabled><p id="player-save-status"></p>';
 for(const id of ['toolbar','second']) {const root=document.getElementById(id);root.innerHTML=controls;ChessSettingsControllers.players(root)}
 await wait(); const toggle=document.querySelector('#hide-player-info');
 check('Disabled by default',!toggle.checked && visible(block));
 toggle.click();await wait();
 check('Both settings surfaces synchronize',document.querySelector('#second input').checked);
 check('Native name, rating and avatar hidden',!visible(block) && !visible(avatar));
 check('Color labels match clocks',panel.querySelector('.chess-player-label').textContent==='Black' && document.querySelector('#board-layout-player-bottom .chess-player-label').textContent==='White');
 check('Clocks and captured pieces remain visible',visible(panel.querySelector('.clock-component')) && visible(panel.querySelector('wc-captured-pieces')));
 check('Chat remains visible',visible(document.querySelector('#chat .cc-user-block-component')));
 const nameSelector='[data-test-element="user-tagline-username"]';
 const names=e=>Array.from(e.querySelectorAll(nameSelector),n=>n.textContent).join(',');
 check('Only the active tournament pair gets its board colors',names(activeGame)==='White,Black' && names(otherGame)==='Bob,Alice' && names(otherPair)==='Alice,Carol' && names(personalList)==='Bob,Alice');
 const otherPanel=document.createElement('div');
 otherPanel.id='player-top';
 otherPanel.innerHTML='<div class="cc-user-block-component"><button data-test-element="user-tagline-username">Carol</button></div><div class="clock-black">5:00</div>';
 document.body.append(otherPanel);await wait();
 check('Only the primary board layout identifies the active pair',names(activeGame)==='White,Black' && names(otherPair)==='Alice,Carol');
 otherPanel.remove();await wait();
 check('Tournament ratings and flags are hidden while both clocks stay visible',Array.from(activeGame.querySelectorAll('.cc-user-rating-default,.cc-country-flag-component')).every(n=>!visible(n)) && Array.from(activeGame.querySelectorAll('.open-games-player-result')).every(n=>visible(n)) && activeGame.textContent.includes('14:58') && activeGame.textContent.includes('14:56') && visible(otherGame.querySelector('.cc-country-flag-component')));
 check('Move summary keeps scores, separator and time control and hides the full projection',match.textContent.trim()==='GM White [1] vs. Black [1] (15 + 10)' && !visible(match.querySelector('.user-chess-title')) && document.querySelector('#chat-copy').innerHTML===originalMatch);
 let clicks=0;
 for(const link of [match.querySelector('.username'),activeGame.querySelector(nameSelector)]) {
   link.addEventListener('click',e=>{e.preventDefault();clicks++},{once:true}); link.click();
 }
 check('Native links and row controls still handle activation',clicks===2 && match.querySelector('.username').getAttribute('href')==='#bob');
 activeGame.classList.remove('open-games-item-active');otherGame.classList.add('open-games-item-active');
 await wait();
 check('Changing the active game restores both previous rows',names(activeGame)==='Bob,Alice' && names(otherGame)==='White,Black' && visible(activeGame.querySelector('.cc-user-rating-default')));
 match.innerHTML=originalMatch.replaceAll('1800','1810').replace('win +3 / draw -5 / lose -13','перемога +4 / нічия -4 / поразка -12');
 const [firstLink,lastLink]=match.querySelectorAll('.username');
 firstLink.nextSibling.splitText(' (1900)'.length);
 const lastScore=lastLink.nextSibling.splitText(' (1810)'.length);
 const projection=lastScore.splitText(lastScore.data.indexOf('\n'));
 projection.splitText(1);
 await wait();
 check('Split native text masks standalone ratings and a localized projection',match.textContent.trim()==='GM White [1] vs. Black [1] (15 + 10)');
 toggle.click();await wait();
 check('Disabling restores the latest native rating, projection and controls',match.innerHTML.includes('(1810)') && match.innerHTML.includes('перемога +4') && visible(match.querySelector('.user-chess-title')) && names(otherGame)==='Bob,Alice');
 toggle.click();await wait();
 const exposed=match.querySelector('.username');
 exposed.firstChild.data='SomeoneElse';await wait();
 check('A reused summary for another pair retains the native update',match.textContent.includes('SomeoneElse (1900)') && match.textContent.includes('Alice (1810)') && match.textContent.includes('перемога +4'));
 match.innerHTML=originalMatch;await wait();
 panel.querySelector('.clock-component').className='clock-component clock-white';await wait();
 check('Board flip updates color',panel.querySelector('.chess-player-label').textContent==='White');
 block.querySelector('button').textContent='Carol';
 toggle.click();await wait();
 check('Disable restores current native information',visible(block)&&visible(avatar)&&block.textContent.includes('Carol')&&!document.querySelector('.chess-player-label'));
 failSave=true;toggle.click();await wait();
 check('Failed save restores disabled preference',!toggle.checked && document.querySelector('#player-save-status').textContent.includes('Could not save'));
 failSave=false;toggle.click();await wait();
 panel.innerHTML='<div id="player-top"><div class="player-row-avatar">Avatar</div><div class="cc-user-block-component">New bot (2200)</div></div>';
 await wait();check('Replaced clockless bot panel uses board orientation',panel.querySelector('.chess-player-label').textContent==='Black' && !visible(panel.querySelector('.player-row-avatar')));
 flipped=true;await new Promise(r=>setTimeout(r,600));
 check('Clockless board flip updates label',panel.querySelector('.chess-player-label').textContent==='White');
 check('Nested player panels do not duplicate labels',panel.querySelectorAll('.chess-player-label').length===1);
 dispatchEvent(new Event('pagehide'));check('Page exit cleans up',!document.querySelector('.chess-player-label') && !document.documentElement.hasAttribute('data-chess-hide-players'));
 dispatchEvent(new Event('pageshow'));await wait();check('Page restore reapplies privacy',!!panel.querySelector('.chess-player-label')&&!visible(panel.querySelector('.cc-user-block-component')));
 document.title='PASS — Player privacy regression checks'; return true;
})().catch(e=>{document.title='FAIL — Player privacy regression checks';throw e});
</script></html>
